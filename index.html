<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人工智能导论 · 智能练习系统 v2</title>
<style>
:root {
  --bg: #0f172a;
  --bg-card: #1e293b;
  --bg-sidebar: #0b1120;
  --text: #e2e8f0;
  --text-secondary: #94a3b8;
  --accent: #6366f1;
  --accent-light: #818cf8;
  --success: #22c55e;
  --error: #ef4444;
  --warning: #f59e0b;
  --border: #334155;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
  --radius: 12px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
}
/* Sidebar */
.sidebar {
  width: 260px;
  background: var(--bg-sidebar);
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  position: fixed;
  height: 100vh;
  left: 0; top: 0;
  z-index: 10;
  transition: transform 0.3s;
}
.sidebar-logo {
  font-size: 20px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent-light), #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 32px;
  padding: 0 8px;
}
.sidebar-logo span { font-size: 12px; display:block; -webkit-text-fill-color: var(--text-secondary); font-weight: 400; margin-top: 2px; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 4px;
  color: var(--text-secondary);
  font-size: 15px;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}
.nav-item:hover { background: rgba(99,102,241,0.1); color: var(--text); }
.nav-item.active { background: rgba(99,102,241,0.2); color: var(--accent-light); font-weight: 600; }
.nav-item .icon { font-size: 20px; width: 24px; text-align: center; }
.nav-badge {
  margin-left: auto;
  background: var(--error);
  color: white;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}
/* Main */
.main {
  margin-left: 260px;
  flex: 1;
  padding: 32px 40px;
  min-height: 100vh;
}
/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 32px;
}
.header-title { font-size: 24px; font-weight: 700; }
.progress-bar-wrap {
  width: 200px; height: 8px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-light));
  border-radius: 4px;
  transition: width 0.5s ease;
}
.stats-row {
  display: flex;
  gap: 20px;
  margin-bottom: 32px;
}
.stat-card {
  flex: 1;
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  border: 1px solid var(--border);
}
.stat-icon {
  font-size: 32px;
  width: 56px; height: 56px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 12px;
  background: rgba(99,102,241,0.15);
}
.stat-value { font-size: 28px; font-weight: 700; }
.stat-label { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
/* Question Card */
.question-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 32px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.q-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 24px;
}
.q-number {
  font-size: 14px;
  color: var(--accent-light);
  font-weight: 600;
  margin-bottom: 8px;
}
.q-type-badge {
  font-size: 11px;
  padding: 4px 12px;
  border-radius: 20px;
  font-weight: 600;
  background: rgba(99,102,241,0.2);
  color: var(--accent-light);
}
.q-type-badge.multi { background: rgba(245,158,11,0.2); color: var(--warning); }
.q-type-badge.bool { background: rgba(34,197,94,0.15); color: var(--success); }
.q-text {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 28px;
  color: var(--text);
}
.options-list { display: flex; flex-direction: column; gap: 12px; }
.option-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 20px;
  border-radius: 10px;
  border: 2px solid var(--border);
  background: transparent;
  color: var(--text);
  cursor: pointer;
  font-size: 15px;
  text-align: left;
  transition: all 0.2s;
  width: 100%;
}
.option-btn:hover:not(.disabled) { border-color: var(--accent); background: rgba(99,102,241,0.08); transform: translateX(4px); }
.option-btn.selected { border-color: var(--accent); background: rgba(99,102,241,0.15); }
.option-btn.correct { border-color: var(--success); background: rgba(34,197,94,0.1); }
.option-btn.wrong { border-color: var(--error); background: rgba(239,68,68,0.1); }
.option-btn .letter {
  width: 36px; height: 36px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 15px;
  background: var(--border);
  flex-shrink: 0;
}
.option-btn.correct .letter { background: var(--success); color: white; }
.option-btn.wrong .letter { background: var(--error); color: white; }
.option-btn.selected .letter { background: var(--accent); color: white; }
.option-btn.disabled { pointer-events: none; }
/* Result */
.result-box {
  margin-top: 20px;
  padding: 20px;
  border-radius: 10px;
  display: none;
}
.result-box.show { display: block; }
.result-box.correct { background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.3); }
.result-box.wrong { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.3); }
.result-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
.result-box.correct .result-title { color: var(--success); }
.result-box.wrong .result-title { color: var(--error); }
/* Analysis */
.analysis-box {
  margin-top: 16px;
  padding: 20px;
  background: rgba(99,102,241,0.05);
  border: 1px solid rgba(99,102,241,0.2);
  border-radius: 10px;
  display: none;
}
.analysis-box.show { display: block; }
.analysis-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--accent-light);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.analysis-content {
  font-size: 14px;
  line-height: 1.8;
  color: var(--text-secondary);
}
.analysis-content .highlight {
  color: var(--accent-light);
  font-weight: 600;
}
.analysis-content .key-point {
  display: block;
  padding: 8px 12px;
  margin: 8px 0;
  background: rgba(99,102,241,0.08);
  border-left: 3px solid var(--accent);
  border-radius: 4px;
  font-size: 13px;
}
/* Actions */
.actions-row {
  display: flex;
  gap: 12px;
  margin-top: 24px;
}
.btn {
  padding: 12px 28px;
  border-radius: 8px;
  border: none;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 8px;
}
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-light); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(99,102,241,0.3); }
.btn-secondary { background: var(--border); color: var(--text); }
.btn-secondary:hover { background: #475569; }
.btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text); }
.btn-outline:hover { border-color: var(--accent); }
.btn-sm { padding: 6px 16px; font-size: 13px; }
/* Wrong Notebook */
.wrong-list { display: flex; flex-direction: column; gap: 12px; }
.wrong-item {
  background: var(--bg-card);
  border-radius: 10px;
  padding: 20px;
  border: 1px solid var(--border);
  display: flex;
  gap: 16px;
  cursor: pointer;
  transition: all 0.2s;
}
.wrong-item:hover { border-color: var(--error); transform: translateX(4px); }
.wrong-q-num {
  width: 40px; height: 40px;
  background: rgba(239,68,68,0.15);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: var(--error);
  font-weight: 700;
  flex-shrink: 0;
}
.wrong-info { flex: 1; }
.wrong-q-text { font-size: 14px; margin-bottom: 6px; line-height: 1.5; }
.wrong-meta { font-size: 12px; color: var(--text-secondary); }
.wrong-count {
  font-size: 12px;
  color: var(--error);
  font-weight: 600;
  white-space: nowrap;
}
/* Settings bar */
.settings-bar {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.setting-select {
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
}
.setting-select:focus { outline: none; border-color: var(--accent); }
.setting-label { font-size: 13px; color: var(--text-secondary); }
/* Empty state */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-secondary);
}
.empty-icon { font-size: 64px; margin-bottom: 16px; }
.empty-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-sidebar); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
/* Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade-in { animation: fadeIn 0.4s ease; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
.loading { animation: pulse 1.5s infinite; }
/* ========== MOBILE & TABLET ========== */
.menu-toggle {
  display: none;
  position: fixed;
  top: 12px; left: 12px;
  z-index: 100;
  width: 44px; height: 44px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text);
  font-size: 22px;
  cursor: pointer;
  align-items: center;
  justify-content: center;
}
.menu-toggle:hover { border-color: var(--accent); background: rgba(99,102,241,0.1); }
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 9;
}

/* Small phone: <=400px */
@media (max-width: 400px) {

.level-up-anim{animation:levelUp 0.8s ease;}
@keyframes levelUp{0%{transform:scale(1)}30%{transform:scale(1.3);filter:brightness(1.5)}100%{transform:scale(1);filter:brightness(1)}}
#confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;}
#particles-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:0.4;}
.question-card.slide-in-right{animation:slideInRight 0.4s cubic-bezier(0.4,0,0.2,1);}
.question-card.slide-in-left{animation:slideInLeft 0.4s cubic-bezier(0.4,0,0.2,1);}
@keyframes slideInRight{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:translateX(0)}}
.sound-toggle{background:none;border:1px solid var(--border);color:var(--text-secondary);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:16px;transition:all 0.2s;}
.sound-toggle:hover{border-color:var(--accent);color:var(--text);}
.sound-toggle.muted{opacity:0.4;}
@keyframes shake{0%,100%{transform:translateX(0)}10%,30%,50%,70%,90%{transform:translateX(-4px)}20%,40%,60%,80%{transform:translateX(4px)}}
.shake{animation:shake 0.5s ease;}
.speed-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600;}
.speed-badge.fast{background:rgba(34,197,94,0.15);color:var(--success);}
.speed-badge.normal{background:rgba(99,102,241,0.15);color:var(--accent-light);}
.speed-badge.slow{background:rgba(239,68,68,0.12);color:var(--error);}
.combo-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:48px;font-weight:900;pointer-events:none;z-index:9998;text-shadow:0 0 30px rgba(249,115,22,0.8);animation:comboPopup 1s ease forwards;}
@keyframes comboPopup{0%{transform:translate(-50%,-50%) scale(0);opacity:1}50%{transform:translate(-50%,-50%) scale(1.5);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
